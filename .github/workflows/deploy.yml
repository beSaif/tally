name: Deploy

# Deploys the Worker (static PWA + API) and applies D1 migrations on every push to main,
# when the repository has the Cloudflare secrets configured:
#   CLOUDFLARE_API_TOKEN   — token with "Edit Cloudflare Workers" + D1 edit permissions
#   CLOUDFLARE_ACCOUNT_ID  — your account id (Workers & Pages overview → Account details)
# One-time setup (locally): npm run setup:cloudflare  (creates the D1 database, writes its id into wrangler.jsonc)
#                           wrangler secret put VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT [/ INVITE_CODE]

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the Cloudflare secrets exist
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not configured; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - run: npm run build
        if: steps.secrets.outputs.ready == 'true'
      - name: Apply D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply tally --remote
      - name: Deploy Worker
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy
